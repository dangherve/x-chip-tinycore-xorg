# x-chip system theme. Applied by x-chip-theme: the five colors replace the
# base pocket palette in the per-user JWM, aterm, and GTK2 configs, and
# THEME_MC_SKIN becomes the Midnight Commander skin. THEME_BG doubles as the
# text color on THEME_ACCENT surfaces, so accents must contrast with it.
THEME_LABEL="Pocket - dark green (default)"
THEME_BG=#0F1716
THEME_PANEL=#223331
THEME_ACCENT=#1F7A66
THEME_FG=#EAF2EF
THEME_MUTED=#6A7A75
THEME_MC_SKIN=pocketclean256
THEME_PREVIEW="234 236 29 255 243"
